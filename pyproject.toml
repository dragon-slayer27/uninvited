[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uninvited"
version = "0.1.0"
description = "What's haunting your laptop? Finds what wakes it at night and what starts without asking, explained by a local Gemma model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vivaan Teotia" }]
dependencies = []

[project.optional-dependencies]
watch = ["temporalio>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
uninvited = "uninvited.cli:main"

[tool.setuptools]
packages = ["uninvited"]

[tool.setuptools.package-data]
uninvited = ["scripts/*.ps1", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
